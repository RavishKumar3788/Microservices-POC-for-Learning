# ==============================================================================
# USERS MICROSERVICE - COST-OPTIMIZED FOR LEARNING
# ==============================================================================
# 
# This is your Users API - manages user accounts, profiles, and authentication.
# Built with .NET, stores data in MongoDB, uses Redis for session caching.
# 
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
  namespace: microservices-dev
  labels:
    app: users-app
    tier: backend
    environment: development

spec:
  replicas: 1                    # Single instance
  selector:
    matchLabels:
      app: users-app
  
  template:
    metadata:
      labels:
        app: users-app
        tier: backend
    
    spec:
      containers:
      - name: users-app
        image: ravishchauhan/user-app:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 8080
          name: http
        
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        
        - name: ConnectionStrings__MongoDB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: MongoDB__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: MongoDbSettings__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: ConnectionStrings__Redis
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        
        - name: Redis__Configuration
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        
        # MINIMAL RESOURCES
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: users-app
  namespace: microservices-dev
  labels:
    app: users-app

spec:
  selector:
    app: users-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP

# ==============================================================================
# API ENDPOINTS (examples):
# - GET    /api/users             - List all users
# - GET    /api/users/{id}        - Get user by ID
# - POST   /api/users             - Create new user
# - PUT    /api/users/{id}        - Update user
# - DELETE /api/users/{id}        - Delete user
# - GET    /health                - Health check
# ==============================================================================
