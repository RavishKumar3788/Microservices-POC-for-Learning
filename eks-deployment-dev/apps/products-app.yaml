# ==============================================================================
# PRODUCTS MICROSERVICE - COST-OPTIMIZED FOR LEARNING
# ==============================================================================
# 
# This is your Products API - manages product catalog, inventory, and pricing.
# Built with .NET, stores data in MongoDB, uses Redis for caching.
# 
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-app
  namespace: microservices-dev
  labels:
    app: products-app
    tier: backend
    environment: development

spec:
  replicas: 1                    # Single instance (cost optimization)
  selector:
    matchLabels:
      app: products-app
  
  template:
    metadata:
      labels:
        app: products-app
        tier: backend
    
    spec:
      containers:
      - name: products-app
        image: ravishchauhan/products-app:latest
        imagePullPolicy: Always  # Always pull to get latest code changes
        
        ports:
        - containerPort: 8080
          name: http
        
        # Environment variables from ConfigMap
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        
        - name: ConnectionStrings__MongoDB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: MongoDB__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: MongoDbSettings__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: ConnectionStrings__Redis
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        
        - name: Redis__Configuration
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        
        # MINIMAL RESOURCES FOR LEARNING
        resources:
          requests:
            memory: "128Mi"      # Minimum 128 MB
            cpu: "100m"          # 0.1 CPU cores
          limits:
            memory: "256Mi"      # Max 256 MB
            cpu: "250m"          # Max 0.25 CPU cores
        # Comparison: Production uses 512Mi-1Gi RAM, 500m-1000m CPU
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health        # ASP.NET Core health check endpoint
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: products-app             # DNS: products-app.microservices-dev.svc.cluster.local
  namespace: microservices-dev
  labels:
    app: products-app

spec:
  selector:
    app: products-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP

# ==============================================================================
# API ENDPOINTS (examples):
# - GET    /api/products          - List all products
# - GET    /api/products/{id}     - Get product by ID
# - POST   /api/products          - Create new product
# - PUT    /api/products/{id}     - Update product
# - DELETE /api/products/{id}     - Delete product
# - GET    /health                - Health check
# ==============================================================================
