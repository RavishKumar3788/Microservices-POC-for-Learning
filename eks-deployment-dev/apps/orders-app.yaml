# ==============================================================================
# ORDERS MICROSERVICE - COST-OPTIMIZED FOR LEARNING
# ==============================================================================
# 
# This is your Orders API - manages customer orders and order processing.
# Communicates with Products API and Users API to validate orders.
# Built with .NET, stores data in MongoDB, uses Redis for caching.
# 
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-app
  namespace: microservices-dev
  labels:
    app: orders-app
    tier: backend
    environment: development

spec:
  replicas: 1                    # Single instance
  selector:
    matchLabels:
      app: orders-app
  
  template:
    metadata:
      labels:
        app: orders-app
        tier: backend
    
    spec:
      containers:
      - name: orders-app
        image: ravishchauhan/orders-app:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 8080
          name: http
        
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        
        - name: ConnectionStrings__MongoDB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: MongoDB__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: MongoDbSettings__ConnectionString
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        
        - name: ConnectionStrings__Redis
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        
        - name: Redis__Configuration
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        
        # Service-to-service communication URLs
        - name: ProductsServiceUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PRODUCTS_SERVICE_URL
        
        - name: ExternalServices__ProductsServiceUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PRODUCTS_SERVICE_URL
        
        - name: ServiceUrls__Products
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PRODUCTS_SERVICE_URL
        
        - name: UsersServiceUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USERS_SERVICE_URL
        
        - name: ExternalServices__UsersServiceUrl
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USERS_SERVICE_URL
        
        - name: ServiceUrls__Users
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USERS_SERVICE_URL
        
        # MINIMAL RESOURCES
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: orders-app
  namespace: microservices-dev
  labels:
    app: orders-app

spec:
  selector:
    app: orders-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP

# ==============================================================================
# API ENDPOINTS (examples):
# - GET    /api/orders            - List all orders
# - GET    /api/orders/{id}       - Get order by ID
# - POST   /api/orders            - Create new order (validates product & user)
# - PUT    /api/orders/{id}       - Update order status
# - DELETE /api/orders/{id}       - Cancel order
# - GET    /health                - Health check
# 
# MICROSERVICE COMMUNICATION:
# When creating an order, this service calls:
# 1. Products API to verify product exists and check stock
# 2. Users API to verify user exists
# 3. Creates order in MongoDB
# 4. Returns order confirmation
# ==============================================================================
