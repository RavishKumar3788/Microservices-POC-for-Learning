# ==============================================================================
# REDIS CACHE - COST-OPTIMIZED FOR LEARNING
# ==============================================================================
# 
# What is Redis?
# -------------
# Redis is an in-memory data structure store used as a database, cache, and
# message broker. It's extremely fast because data is stored in RAM.
# 
# Why Redis in Microservices?
# ---------------------------
# 1. CACHING: Store frequently accessed data (products, user profiles)
#    - Reduces database load
#    - Improves response time (milliseconds vs seconds)
#    - Example: Cache product details to avoid querying MongoDB repeatedly
# 
# 2. SESSION STORAGE: Store user sessions across multiple app instances
#    - User logs in once, session shared across all pods
#    - Survives pod restarts
# 
# 3. RATE LIMITING: Track API request counts
#    - Prevent abuse (e.g., max 100 requests per minute per user)
#    - Use INCR command to count requests
# 
# 4. DISTRIBUTED LOCKS: Coordinate between microservices
#    - Ensure only one instance processes a job
#    - Use SETNX (set if not exists) for locking
# 
# 5. PUB/SUB: Real-time messaging between services
#    - Publish events, subscribe to notifications
#    - Example: Order created → notify inventory service
# 
# ==============================================================================

---
# ==============================================================================
# DEPLOYMENT - Manages Redis Pods
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: microservices-dev
  labels:
    app: redis
    tier: cache
    environment: development
    
  annotations:
    description: "Redis cache for improving application performance"

spec:
  # --------------------------------------------------------------------------
  # REPLICA CONFIGURATION
  # --------------------------------------------------------------------------
  replicas: 1                    # Single instance
  # Why 1 replica?
  # - Sufficient for learning and low traffic
  # - Cache can handle thousands of requests per second
  # 
  # Production typically uses:
  # - 3+ replicas for high availability
  # - Redis Sentinel or Redis Cluster for automatic failover
  
  selector:
    matchLabels:
      app: redis
  
  # --------------------------------------------------------------------------
  # POD TEMPLATE
  # --------------------------------------------------------------------------
  template:
    metadata:
      labels:
        app: redis
        tier: cache
        environment: development
    
    spec:
      containers:
      - name: redis
        
        # ------------------------------------------------------------------
        # DOCKER IMAGE
        # ------------------------------------------------------------------
        image: redis:7-alpine    # Redis 7 on Alpine Linux (smallest image)
        # Why Alpine?
        # - 30-40 MB vs 100+ MB for standard image
        # - Faster to pull and deploy
        # - Same Redis functionality
        
        imagePullPolicy: IfNotPresent
        
        # ------------------------------------------------------------------
        # PORTS
        # ------------------------------------------------------------------
        ports:
        - containerPort: 6379    # Redis default port
          name: redis
          protocol: TCP
        
        # ------------------------------------------------------------------
        # VOLUME MOUNTS
        # ------------------------------------------------------------------
        volumeMounts:
        - name: redis-storage    # Persistent storage
          mountPath: /data       # Redis data directory
        # Redis is in-memory, but we persist to disk for:
        # - Snapshots (RDB files)
        # - Append-only files (AOF) for durability
        # - Survives pod restarts
        
        # ------------------------------------------------------------------
        # REDIS CONFIGURATION via Command
        # ------------------------------------------------------------------
        command:
        - redis-server           # Start Redis server
        - --appendonly           # Enable append-only file (AOF)
        - "yes"
        # AOF logs every write command to disk
        # On restart, Redis replays the log to rebuild data
        # Trade-off: Slightly slower writes, but better durability
        
        - --maxmemory            # Maximum memory to use
        - "200mb"
        # Limits Redis memory usage (protects node from OOM)
        # Redis is in-memory, so this is the actual data capacity
        # 200 MB can hold ~1-5 million small key-value pairs
        
        - --maxmemory-policy     # What to do when max memory reached
        - "allkeys-lru"
        # Eviction policies:
        # - noeviction: Return errors when full (default)
        # - allkeys-lru: Remove least recently used keys (BEST for cache)
        # - allkeys-lfu: Remove least frequently used keys
        # - volatile-lru: Remove LRU from keys with TTL only
        # - volatile-ttl: Remove keys with shortest TTL
        # 
        # We use allkeys-lru because:
        # - Automatically makes room for new data
        # - Keeps most accessed data in memory
        # - Perfect for caching use case
        
        # ------------------------------------------------------------------
        # RESOURCE LIMITS
        # ------------------------------------------------------------------
        resources:
          requests:
            memory: "128Mi"      # Minimum 128 MB RAM
            cpu: "100m"          # 0.1 CPU cores
          limits:
            memory: "256Mi"      # Maximum 256 MB RAM
            cpu: "250m"          # 0.25 CPU cores max
        
        # Why these values?
        # - Redis is very efficient (can handle thousands of ops/sec with 0.1 CPU)
        # - 256 MB limit aligns with 200 MB maxmemory (+ overhead)
        # - Saves ~80% vs production config
        
        # Memory breakdown:
        # - 200 MB: Redis data (configured via --maxmemory)
        # - 56 MB: Redis overhead (connections, buffers, metadata)
        # - 256 MB: Total limit
        
        # ------------------------------------------------------------------
        # LIVENESS PROBE - Is Redis responding?
        # ------------------------------------------------------------------
        livenessProbe:
          exec:
            command:
            - redis-cli          # Redis command-line interface
            - ping               # Ping command
          # Expected response: PONG
          # If Redis doesn't respond, pod is restarted
          
          initialDelaySeconds: 20  # Wait 20s for Redis to start
          periodSeconds: 10        # Check every 10 seconds
          timeoutSeconds: 5        # Timeout after 5 seconds
          failureThreshold: 3      # Restart after 3 failures
        
        # ------------------------------------------------------------------
        # READINESS PROBE - Is Redis ready for traffic?
        # ------------------------------------------------------------------
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          
          initialDelaySeconds: 5   # Redis starts quickly
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
      # ----------------------------------------------------------------------
      # VOLUMES
      # ----------------------------------------------------------------------
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc   # 1 GB EBS volume from storage.yaml

# ==============================================================================
# REDIS PERSISTENCE EXPLAINED
# ==============================================================================
# 
# Redis offers two persistence modes:
# 
# 1. RDB (Redis Database Backup):
#    - Point-in-time snapshots
#    - Saved to dump.rdb file
#    - Compact and fast to load
#    - May lose data between snapshots
# 
# 2. AOF (Append-Only File):
#    - Logs every write operation
#    - More durable (we use this)
#    - Larger file size
#    - Can be compacted with BGREWRITEAOF
# 
# We use AOF because:
# - Better for learning (see how Redis works)
# - Better durability (important for session/cache data)
# - Automatic compaction keeps file small
# 
# ==============================================================================

---
# ==============================================================================
# SERVICE - Network endpoint for Redis
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis                    # DNS name: redis.microservices-dev.svc.cluster.local
  namespace: microservices-dev
  labels:
    app: redis
    tier: cache
    
  annotations:
    description: "Redis service endpoint for caching"

spec:
  type: ClusterIP                # Internal only (secure!)
  # Redis should NEVER be exposed to internet!
  # No authentication in this config (learning simplicity)
  # Production MUST use requirepass and TLS
  
  selector:
    app: redis                   # Route to Redis pods
  
  ports:
  - port: 6379                   # Service port
    targetPort: 6379             # Pod port
    protocol: TCP
    name: redis

