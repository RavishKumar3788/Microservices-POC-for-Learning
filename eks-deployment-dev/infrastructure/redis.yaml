# ==============================================================================
# USEFUL COMMANDS
# ==============================================================================
# 
# 1. Deploy Redis:
#    kubectl apply -f redis.yaml
# 
# 2. Check status:
#    kubectl get deployment redis -n microservices-dev
#    kubectl get pods -l app=redis -n microservices-dev
# 
# 3. View logs:
#    kubectl logs -f deployment/redis -n microservices-dev
# 
# 4. Connect to Redis CLI:
#    kubectl exec -it deployment/redis -n microservices-dev -- redis-cli
#    
#    Try these commands:
#    > PING                           # Should return PONG
#    > SET mykey "Hello Redis"        # Store a key
#    > GET mykey                      # Retrieve a key
#    > KEYS *                         # List all keys
#    > INFO memory                    # Memory usage stats
#    > INFO stats                     # Statistics
#    > DBSIZE                         # Number of keys
#    > MONITOR                        # Watch all commands in real-time
#    > TTL mykey                      # Time to live (expiration)
#    > DEL mykey                      # Delete a key
# 
# 5. Check memory usage:
#    kubectl exec deployment/redis -n microservices-dev -- redis-cli INFO memory
# 
# 6. Monitor Redis operations:
#    kubectl exec deployment/redis -n microservices-dev -- redis-cli MONITOR
#    # Shows all commands being executed in real-time
# 
# 7. Port forward to local machine:
#    kubectl port-forward svc/redis 6379:6379 -n microservices-dev
#    # Connect from your machine: redis-cli -h localhost -p 6379
# 
# 8. Flush all data (careful!):
#    kubectl exec deployment/redis -n microservices-dev -- redis-cli FLUSHALL
# 
# ==============================================================================

# ==============================================================================
# MONITORING REDIS
# ==============================================================================
# 
# Key metrics to watch:
# 
# 1. Memory Usage:
#    redis-cli INFO memory | grep used_memory_human
#    - Should stay below maxmemory (200 MB)
#    - If approaching limit, LRU eviction kicks in
# 
# 2. Hit Rate:
#    redis-cli INFO stats | grep keyspace_hits
#    redis-cli INFO stats | grep keyspace_misses
#    - Hit rate = hits / (hits + misses)
#    - Good cache: 80%+ hit rate
#    - Low hit rate: Review what you're caching
# 
# 3. Connected Clients:
#    redis-cli INFO clients | grep connected_clients
#    - Number of active connections
#    - Each microservice pod creates connections
# 
# 4. Operations per Second:
#    redis-cli INFO stats | grep instantaneous_ops_per_sec
#    - Shows current load
# 
# ==============================================================================

# ==============================================================================
# TROUBLESHOOTING
# ==============================================================================
# 
# Redis using too much memory:
# - Check: kubectl exec deployment/redis -n microservices-dev -- redis-cli INFO memory
# - Solution: Increase maxmemory limit or review cached data
# - Tip: Use TTL on all cached data to auto-expire
# 
# Cache misses too high:
# - Check cache hit rate (see monitoring section)
# - Solution: Increase TTL, cache more data, or warm up cache
# 
# Slow performance:
# - Check: kubectl top pod -l app=redis -n microservices-dev
# - Solution: Increase CPU limits if hitting threshold
# - Tip: Redis is single-threaded, benefits from higher CPU clock speed
# 
# Data lost after restart:
# - Check: kubectl logs deployment/redis -n microservices-dev
# - Verify: AOF file exists (kubectl exec deployment/redis -- ls -lh /data)
# - Solution: Ensure PVC is properly bound
# 
# Cannot connect from microservices:
# - Check service: kubectl get svc redis -n microservices-dev
# - Check endpoints: kubectl get endpoints redis -n microservices-dev
# - Verify connection string in ConfigMap
# 
# ==============================================================================

