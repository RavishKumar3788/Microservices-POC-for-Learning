# ==============================================================================
# PERSISTENT STORAGE - COST-OPTIMIZED FOR LEARNING
# ==============================================================================
# 
# What is Persistent Storage in Kubernetes?
# -----------------------------------------
# Containers are ephemeral (temporary) by nature - when a pod dies, all its
# data is lost. Persistent storage allows data to survive pod restarts.
# 
# Storage Hierarchy in Kubernetes:
# --------------------------------
# 1. StorageClass: Defines TYPE of storage (SSD, HDD, cloud provider)
# 2. PersistentVolume (PV): Actual storage resource in the cluster
# 3. PersistentVolumeClaim (PVC): Request for storage by a pod
# 4. Volume Mount: Mounts the PVC into a container at a specific path
# 
# How it works:
# ------------
# 1. Admin creates StorageClass (or use default)
# 2. User creates PVC requesting storage (size, access mode)
# 3. Kubernetes finds/creates a PV that matches the PVC
# 4. PVC binds to PV
# 5. Pod mounts the PVC as a volume
# 
# Cost Optimization for Learning:
# ------------------------------
# ✓ Using gp3 (cheapest general-purpose SSD on AWS)
# ✓ Minimal storage sizes (just enough for learning)
# ✓ Single availability zone (no cross-AZ data transfer costs)
# ✓ No snapshots or backups configured
# 
# ==============================================================================

---
# ==============================================================================
# STORAGE CLASS - Defines HOW storage is provisioned
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-dev                   # Name to reference in PVCs
  labels:
    environment: development
  annotations:
    # Documentation for other users
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: ebs.csi.aws.com      # AWS EBS CSI driver provisions the volumes
volumeBindingMode: WaitForFirstConsumer
# ^^^ This delays volume creation until a pod using it is scheduled
# Benefits: 1) Volume created in same AZ as pod (lower latency)
#          2) No unused volumes created
#          3) Better cost optimization

parameters:
  type: gp3                       # General Purpose SSD (3rd generation)
  # gp3 is cheaper and faster than gp2
  # Cost: ~$0.08/GB-month (vs gp2 at $0.10/GB-month)
  
  encrypted: "true"               # Encrypt data at rest (AWS best practice)
  # No additional cost for encryption with EBS
  
  fsType: ext4                    # File system type (standard Linux filesystem)
  # ext4 is reliable and well-supported

  iops: "3000"                    # Input/Output Operations Per Second
  # gp3 baseline is 3000 IOPS (sufficient for learning)
  
  throughput: "125"               # MB/s throughput
  # gp3 baseline is 125 MB/s (sufficient for learning)

allowVolumeExpansion: true        # Allow resizing volumes without recreating
# You can increase size later if needed (but not decrease!)

reclaimPolicy: Delete             # Delete EBS volume when PVC is deleted
# Options: Delete (cleanup), Retain (keep for data recovery)
# For learning: Delete to avoid orphaned volumes

# ==============================================================================
# COST BREAKDOWN - gp3 Storage:
# 2 GB:  $0.16/month
# 5 GB:  $0.40/month
# Total: $0.56/month (negligible for learning!)
# ==============================================================================

---
# ==============================================================================
# MONGODB STORAGE - Minimal size for learning
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim       # PVC = Request for storage
metadata:
  name: mongodb-pvc               # Name to reference in pod volumes
  namespace: microservices-dev
  labels:
    app: mongodb
    environment: development
    
  annotations:
    # Documentation for understanding
    description: "MongoDB data storage - stores database files"
    usage: "Mounted at /data/db in MongoDB container"

spec:
  accessModes:
    - ReadWriteOnce               # RWO = Can be mounted by ONE node at a time
    # Access Modes explained:
    # - ReadWriteOnce (RWO): Single node, read-write (most common)
    # - ReadOnlyMany (ROX): Multiple nodes, read-only
    # - ReadWriteMany (RWX): Multiple nodes, read-write (requires special storage)
    # 
    # EBS volumes only support RWO (block storage limitation)
  
  storageClassName: ebs-dev       # Use our custom storage class
  
  resources:
    requests:
      storage: 2Gi                # Request 2 GB (minimal for learning)
      # Production would use 50-100 GB or more
      # 2 GB can hold ~100,000-500,000 small documents

# ==============================================================================
# LEARNING NOTE - Storage Sizing:
# 
# How much do you need?
# - MongoDB: ~2 GB sufficient for 100K+ test documents
# - Redis: ~1 GB sufficient for thousands of cache entries
# 
# What happens if you run out?
# - Pods will fail to start
# - Database writes will fail
# - You'll see "disk full" errors in logs
# 
# Solution:
# - Edit this file and increase storage size
# - Apply changes: kubectl apply -f storage.yaml
# - Kubernetes will expand the volume (no data loss!)
# ==============================================================================

---
# ==============================================================================
# REDIS STORAGE - Minimal size for cache
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: microservices-dev
  labels:
    app: redis
    environment: development
    
  annotations:
    description: "Redis cache storage - stores cache snapshots and AOF logs"
    usage: "Mounted at /data in Redis container"

spec:
  accessModes:
    - ReadWriteOnce               # Single node access
  
  storageClassName: ebs-dev       # Use our custom storage class
  
  resources:
    requests:
      storage: 1Gi                # Request 1 GB (minimal for cache)
      # Redis is in-memory, disk is only for persistence
      # 1 GB disk can store several snapshots of cache data

# ==============================================================================
# WHY NO ELASTICSEARCH?
# 
# For learning purposes, we're skipping Elasticsearch to save costs:
# - Elasticsearch requires ~1 GB RAM minimum (increases cluster size)
# - Logs can be viewed with: kubectl logs <pod-name>
# - For production, Elasticsearch provides powerful log aggregation
# - Cost saving: ~$15-20/month by skipping it
# 
# You can always view logs directly:
# kubectl logs -f deployment/products-app -n microservices-dev
# ==============================================================================

# ==============================================================================
# VERIFICATION COMMANDS:
# 
# 1. Apply storage configuration:
#    kubectl apply -f storage.yaml
# 
# 2. Check storage class:
#    kubectl get storageclass ebs-dev
# 
# 3. Check PVCs status:
#    kubectl get pvc -n microservices-dev
#    
#    Status meanings:
#    - Pending: Waiting for pod to be scheduled (WaitForFirstConsumer mode)
#    - Bound: Successfully bound to a PersistentVolume
#    - Lost: PV was deleted but PVC still exists
# 
# 4. Check PVs (created automatically):
#    kubectl get pv
# 
# 5. Describe PVC for details:
#    kubectl describe pvc mongodb-pvc -n microservices-dev
# 
# 6. Check actual EBS volumes in AWS Console:
#    EC2 > Volumes (you'll see the actual EBS volumes created)
# ==============================================================================

# ==============================================================================
# CLEANUP NOTES:
# 
# When you delete the PVC:
# 1. PVC is deleted immediately
# 2. PV is marked for deletion
# 3. EBS volume is deleted from AWS
# 4. You are no longer billed for the storage
# 
# IMPORTANT: Data is permanently lost when PVC is deleted!
# For learning, this is fine. For production, use Retain policy and backups.
# ==============================================================================
