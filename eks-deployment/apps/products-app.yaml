# ==============================================================================
# PRODUCTS MICROSERVICE DEPLOYMENT FOR EKS
# ==============================================================================
# Products API with auto-scaling capabilities
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-app
  namespace: microservices-poc
  labels:
    app: products-app
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products-app
  template:
    metadata:
      labels:
        app: products-app
        tier: backend
    spec:
      containers:
      - name: products-app
        image: ravishchauhan/products-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__MongoDB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MONGODB_CONNECTION_STRING
        - name: ConnectionStrings__Redis
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONNECTION_STRING
        - name: ElasticSearch__Url
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ELASTICSEARCH_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: products-app
  namespace: microservices-poc
  labels:
    app: products-app
spec:
  selector:
    app: products-app
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: products-app-hpa
  namespace: microservices-poc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: products-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
